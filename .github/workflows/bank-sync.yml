name: Sync connected banks
on:
  schedule:
    # Once at the start of the day, same PST/PDT-safe double-fire as morning-digest (vercel.json). Freshness the
    # rest of the day comes from syncIfStale() when a finance question is actually asked, not from a tighter cron.
    - cron: '10 14 * * *'
    - cron: '10 15 * * *'
  workflow_dispatch:
permissions: {}
concurrency:
  group: bank-sync-worker
  cancel-in-progress: false
jobs:
  sync:
    if: vars.BANK_SYNC_SCHEDULE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Sync bank connections
        env:
          BANK_APP_ORIGIN: ${{ vars.APP_ORIGIN }}
          BANK_CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          test -n "$BANK_APP_ORIGIN"
          test -n "$BANK_CRON_SECRET"
          curl --proto '=https' --fail --silent --show-error --max-time 290 \
            --header "Authorization: Bearer $BANK_CRON_SECRET" \
            "${BANK_APP_ORIGIN%/}/api/ops/bank-sync"
